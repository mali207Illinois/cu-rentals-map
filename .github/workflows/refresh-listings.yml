name: Refresh rental listings

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rental-listing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for University Group's public directory
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Refresh each realtor independently
        id: scrape
        shell: bash
        run: |
          failed=0
          for scraper in scrape_jsm.py scrape_greenstreet.py scrape_smile.py scrape_bankier.py scrape_university_group.py; do
            if ! python "$scraper"; then
              echo "::error::${scraper} failed; its previous valid feed remains available"
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Publish successfully refreshed feeds
        run: |
          git add jsm-listing-samples.json greenstreet-listings.json smile-listings.json bankier-listings.json university-group-listings.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public rental listing snapshots'
            git push
          fi
      - name: Report failed feeds in Actions
        if: steps.scrape.outputs.failed == '1'
        run: exit 1
